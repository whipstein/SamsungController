name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Packaging identity tests
        run: python -m unittest discover -s packaging/tests
      - name: Restore
        run: dotnet restore SamsungController.sln
      - name: Build
        run: dotnet build SamsungController.sln --configuration Release --no-restore --disable-build-servers -m:1
      - name: Test
        run: dotnet test SamsungController.sln --configuration Release --no-build --no-restore --disable-build-servers -m:1
