name: Release packages

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build-packages:
    name: Package ${{ matrix.package }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, rid: osx-arm64, package: macos-arm64 }
          - { os: macos-15-intel, rid: osx-x64, package: macos-x64 }
          - { os: windows-latest, rid: win-x64, package: windows-x64 }
          - { os: windows-11-arm, rid: win-arm64, package: windows-arm64 }
          - { os: ubuntu-latest, rid: linux-x64, package: linux-x64 }
          - { os: ubuntu-24.04-arm, rid: linux-arm64, package: linux-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Build self-contained application
        run: python packaging/build.py --rid ${{ matrix.rid }}
      - name: Smoke-test native packaged application
        run: python packaging/smoke-test.py --manifest artifacts/dist/build-${{ matrix.rid }}.json
      - uses: actions/upload-artifact@v7
        with:
          # Keep the named artifact container expected by the release download step.
          archive: true
          name: SamsungController-${{ matrix.package }}
          path: |
            artifacts/dist/*.zip
            artifacts/dist/*.tar.gz
          if-no-files-found: error

  draft-release:
    name: Prepare draft release (Mac signing required)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          path: artifacts/dist
          merge-multiple: true
      - name: Prepare unpublished release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          # CI never publishes unsigned Mac apps. Maintainers replace both Mac
          # archives with signed/notarized/stapled builds before publishing.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
            gh release upload "$RELEASE_TAG" artifacts/dist/*.zip artifacts/dist/*.tar.gz --clobber
          else
            gh release create "$RELEASE_TAG" artifacts/dist/*.zip artifacts/dist/*.tar.gz \
              --draft --verify-tag --title "SamsungController $RELEASE_TAG" \
              --notes-file packaging/RELEASE-NOTES.md
          fi
