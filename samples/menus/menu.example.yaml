version: 1
id: generic-picture-menu
name: Generic Samsung Picture Menu Template
model: Replace with your TV model

# Replace every context value and visually verify every route on the actual TV.
# Nothing in this example is marked verified or eligible for execution.
context:
  firmware: unrecorded
  signal: unrecorded
  pictureMode: unrecorded
  input: unrecorded

# Keep settings-dependent menu layouts in this same model file. Add another
# configuration when a TV selection causes rows to appear, disappear, or move.
configurations:
  - id: standard
    name: Standard menu
    conditions: Replace with the setting values that produce this visible list.

timing:
  defaultDelay: 300ms
  screenChangeDelay: 800ms
  returnDelay: 300ms
  verified: true

# Nest every menu's on-screen rows under children in their TV display order.
nodes:
  - id: tv-interface
    label: TV interface
    description: Root for modeled TV interface states.
    children:
      - id: normal-video
        label: Normal video
        description: No TV menu is expected to be visible.

      - id: settings
        label: Settings
        description: Replace this with the settings surface shown by your TV.
        children:
          - id: picture
            label: Picture
            children:
              - id: expert-settings
                label: Expert settings
                children:
                  - id: example-setting
                    label: Example setting
                    description: Rename or replace this node with a real setting from your TV.
              - id: example-tv-function
                label: Example TV function
                description: Navigation highlights this row but does not press OK to start it.
                controlType: action
              - id: example-unavailable-feature
                label: Example unavailable feature
                description: This row is always visible but gray on the modeled display.
                disabled: true

anchors:
  - id: normal-video
    label: Return to normal video
    target: normal-video
    configuration: standard
    verified: false
    description: Example only. Record and verify the correct return sequence for your TV.
    returnStrategy:
      menuRoot: settings
      atMenuRoot:
        verified: false
        steps:
          - key: KEY_RETURN
      belowMenuRoot:
        verified: false
        steps:
          - key: KEY_RETURN
    steps:
      - key: KEY_RETURN

transitions:
  - id: open-settings
    from: normal-video
    to: settings
    configuration: standard
    verified: false
    description: Example only. Record this transition from the browser UI.
    steps:
      - key: KEY_MENU

  - id: open-picture
    from: settings
    to: picture
    configuration: standard
    verified: false
    description: Example only. Replace with the observed route on your TV.
    steps:
      - key: KEY_DOWN
      - key: KEY_ENTER

  - id: open-expert-settings
    from: picture
    to: expert-settings
    configuration: standard
    verified: false
    description: Example only. Replace with the observed route on your TV.
    steps:
      - key: KEY_DOWN
      - key: KEY_ENTER
