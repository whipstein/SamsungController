version: 1

# This catalog is intentionally generic and unverified. Copy it to an ignored
# personal location before adapting it to a real TV.
variables:
  shortWait: 300ms

macros:
  ExampleMenuKey:
    description: Send one ordinary menu key after reviewing it for your TV
    confirmBeforeRun: false
    verified: false
    verificationPasses: 0
    steps:
      - key: KEY_MENU
        delay: ${shortWait}

  ExampleSequence:
    description: Demonstrate a nested call, explicit wait, and return key
    confirmBeforeRun: true
    verified: false
    verificationPasses: 0
    steps:
      - call: ExampleMenuKey
      - delay: 500ms
      - key: KEY_RETURN
